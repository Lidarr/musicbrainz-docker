variables:
  majorVersion: '1.0'
  minorVersion: $[counter('minorVersion')]
  version: '$(majorVersion).$(minorVersion)'
  buildName: '$(Build.SourceBranchName).$(version)'

trigger:
  branches:
    include:
      - master

pr:
  - master

jobs:
  - job:
    displayName: Setup
    pool:
      vmImage: 'Ubuntu-22.04'
    steps:
      - powershell: Write-Host "##vso[build.updatebuildnumber]$($env:VERSION)"
        displayName: Set Build Name

  - job:
    displayName: Build postgres
    pool:
      vmImage: 'Ubuntu-22.04'
    steps:
      - task: Docker@2
        displayName: Build and push latest image
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
        inputs:
          containerRegistry: 'ghcr'
          repository: lidarr/mb-postgres
          command: buildAndPush
          Dockerfile: build/postgres/Dockerfile
          tags: |
            latest
            $(Build.SourceBranchName)
            $(version)

      - task: Docker@2
        displayName: Build and push PR image
        condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
        inputs:
          containerRegistry: 'ghcr'
          repository: lidarr/mb-postgres
          command: buildAndPush
          Dockerfile: build/postgres/Dockerfile
          tags: |
            pr-$(System.PullRequest.PullRequestNumber)

  - job:
    displayName: Build server
    pool:
      vmImage: 'Ubuntu-22.04'
    steps:
      - task: Docker@2
        displayName: Build and push latest image
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
        inputs:
          containerRegistry: 'ghcr'
          repository: lidarr/mb-server
          command: buildAndPush
          Dockerfile: build/musicbrainz/Dockerfile
          tags: |
            latest
            $(Build.SourceBranchName)
            $(version)

      - task: Docker@2
        displayName: Build and push latest image
        condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))
        inputs:
          containerRegistry: 'ghcr'
          repository: lidarr/mb-server
          command: buildAndPush
          Dockerfile: build/musicbrainz/Dockerfile
          tags: |
            pr-$(System.PullRequest.PullRequestNumber)
